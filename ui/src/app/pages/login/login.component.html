<div class="flex justify-content-center align-items-center min-h-screen wrapper surface-50 p-3">
    <form
        class="surface-card p-4 md:p-5 shadow-3 border-round-xl w-full max-w-md border-top-3 border-green-500 flex flex-column gap-3"
        [formGroup]="login_form">
        
        <div class="text-center mb-3">
            <img src="assets/seabird-logo.jpg" alt="Seabird Marine" style="max-height: 80px; max-width: 100%; object-fit: contain;" class="mb-3" />
            <h3 class="text-2xl font-bold text-900 m-0 mb-1">Container Inventory</h3>
            <p class="text-500 m-0 text-sm">Sign in to manage inventory verified from the field</p>
        </div>
        
        <hr class="border-300 m-0 mb-2" />

        <div class="field flex flex-column gap-1">
            <label class="text-800 font-semibold text-sm" for="user_name">User Name</label>
            <div class="p-inputgroup">
                <span class="p-inputgroup-addon"><i class="pi pi-user"></i></span>
                <input
                    pInputText
                    type="text"
                    formControlName="user_name"
                    id="user_name"
                    class="w-full"
                    placeholder="Enter username" />
            </div>
            <div *ngIf="!login_form.controls['user_name'].untouched && login_form.controls['user_name'].invalid" class="mt-1">
                <small *ngIf="login_form.controls['user_name'].errors?.['required']" class="text-red-700 block text-xs">Username is required.</small>
                <small *ngIf="login_form.controls['user_name'].errors?.['minlength']" class="text-red-700 block text-xs">Minimum 3 characters required.</small>
            </div>
        </div>

        <div class="field flex flex-column gap-1">
            <label class="text-800 font-semibold text-sm" for="password">Password</label>
            <div class="p-inputgroup">
                <span class="p-inputgroup-addon"><i class="pi pi-lock"></i></span>
                <input
                    pInputText
                    type="password"
                    formControlName="password"
                    id="password"
                    class="w-full"
                    placeholder="Enter password" />
            </div>
            <div *ngIf="!login_form.controls['password'].untouched && login_form.controls['password'].invalid" class="mt-1">
                <small *ngIf="login_form.controls['password'].errors?.['required']" class="text-red-700 block text-xs">Password is required.</small>
                <small *ngIf="login_form.controls['password'].errors?.['minlength']" class="text-red-700 block text-xs">Minimum 8 characters required.</small>
            </div>
        </div>

        <div class="field flex flex-column gap-1">
            <label class="text-800 font-semibold text-sm" for="location">Location</label>
            <p-dropdown 
                id="location"
                formControlName="location"
                [options]="locations"
                optionLabel="name"
                [style]="{'width':'100%'}"
                styleClass="w-full"
                placeholder="Select a Location" />
            <div *ngIf="!login_form.controls['location'].untouched && login_form.controls['location'].invalid" class="mt-1">
                <small class="text-red-700 block text-xs">Location selection is required.</small>
            </div>
        </div>

        <div class="mt-3">
            <p-button
                type="button"
                label="Sign In"
                icon="pi pi-sign-in"
                styleClass="w-full p-button-lg"
                severity="success"
                (onClick)="login()"
                [disabled]="login_form.invalid"></p-button>
        </div>
    </form>
</div>
